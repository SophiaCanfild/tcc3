<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro e Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Botões de Navegação por Abas -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="abrirAba('cadastro')">Cadastro</button>
            <button class="tab-btn" onclick="abrirAba('admin')">Painel Admin</button>
        </div>

        <!-- Tela de Cadastro -->
        <section id="cadastro" class="tab-content active">
            <h2>Formulário de Cadastro</h2>
            <form id="cadastroForm">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Digite seu nome">
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="Digite seu e-mail">
                </div>
                <div class="form-group">
                    <label for="perfil">Perfil de Acesso</label>
                    <select id="perfil" required>
                        <option value="Usuário">Usuário Comum</option>
                        <option value="Moderador">Moderador</option>
                        <option value="Administrador">Administrador</option>
                    </select>
                </div>
                <button type="submit">Cadastrar Usuário</button>
            </form>
        </section>

        <!-- Área Administrativa -->
        <section id="admin" class="tab-content">
            <h2>Painel Administrativo</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Perfil</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaUsuarios"></tbody>
                </table>
                <div id="mensagemVazia" class="empty-msg">Nenhum usuário cadastrado ainda.</div>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
